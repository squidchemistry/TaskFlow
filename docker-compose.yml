version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ismo_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ismo_db
      JWT_SECRET: docker_dev_secret_change_in_prod
      JWT_EXPIRES_IN: 7d
      PORT: 4000
      NODE_ENV: production
      ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      - postgres
    command: sh -c "npx prisma migrate deploy && node src/index.js"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - backend

volumes:
  postgres_data:
